# Copy this file to databases.yaml and adjust paths/hashes for your machine.
# The bundled small RDP FASTA lives under database/. Keep large/custom FASTA
# files outside Git history unless your distribution policy allows them.

databases:
  rdp_16s_v18:
    version: v18
    taxonomy_format: sintax
    type: taxonomy_annotation
    roles:
      - taxonomy_annotation
      - chimera_reference
    sequence_path: database/rdp_16s_v18.fa
    sha256: replace_with_local_sha256
    aliases:
      - rdp
      - rdp_16s_v18.fa

  silva_16s_v123:
    version: v123
    taxonomy_format: sintax
    type: taxonomy_annotation
    roles:
      - taxonomy_annotation
    sequence_path: database/silva_16s_v123.fa
    sha256: replace_with_local_sha256
    aliases:
      - silva
      - silva_16s_v123.fa

  custom_16s_database:
    version: release_label
    taxonomy_format: sintax
    type: taxonomy_annotation
    roles:
      - taxonomy_annotation
    sequence_path: database/custom_16s_database.fa
    sha256: replace_with_local_sha256
    aliases:
      - custom16s
