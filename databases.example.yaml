# Copy this file to databases.yaml and adjust paths/hashes for your machine.
# Large FASTA files should stay outside Git history; databas/ is gitignored.

databases:
  rdp_16s_v18:
    version: v18
    taxonomy_format: sintax
    type: taxonomy_annotation
    roles:
      - taxonomy_annotation
      - chimera_reference
    sequence_path: databas/rdp_16s_v18.fa
    sha256: replace_with_local_sha256
    aliases:
      - rdp
      - rdp_16s_v18.fa

  silva_16s_v123:
    version: v123
    taxonomy_format: sintax
    type: taxonomy_annotation
    roles:
      - taxonomy_annotation
    sequence_path: databas/silva_16s_v123.fa
    sha256: replace_with_local_sha256
    aliases:
      - silva
      - silva_16s_v123.fa

  custom_16s_database:
    version: release_label
    taxonomy_format: sintax
    type: taxonomy_annotation
    roles:
      - taxonomy_annotation
    sequence_path: databas/custom_16s_database.fa
    sha256: replace_with_local_sha256
    aliases:
      - custom16s
